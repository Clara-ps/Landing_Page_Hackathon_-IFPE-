<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f8f9fa;
            font-family: Arial, sans-serif;
        }

        .login {
            width: 350px;
            padding: 30px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 10px #ccc;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            border: 0;
            border-radius: 5px;
            background: #0d6efd;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="login">
        <h2>Login</h2>
        <input type="email" placeholder="E-mail">
        <input type="password" placeholder="Senha">
        <button>Entrar</button>
    </div>

</body>
</html>
